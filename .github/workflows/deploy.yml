name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Stamp service worker cache version
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          sed -i "s/const CACHE = 'stotram-v[^']*'/const CACHE = 'stotram-${COMMIT}'/" service-worker.js
          echo "Service worker cache → stotram-${COMMIT}"

      - name: Generate transliterations (Telugu → Devanagari + IAST)
        run: |
          echo "Running transliterator on all data/**/*.txt files..."
          node scripts/transliterate.js
          echo "Transliteration complete."

      - name: Generate SVG images (if not already present)
        continue-on-error: true
        run: |
          echo "Generating stotram images..."
          node scripts/generate-images.js
          echo "Images generated."

      - name: Generate favicon index
        continue-on-error: true
        run: |
          ls assets/icons/options/*.svg | xargs -I{} basename {} .svg | jq -R . | jq -s . > assets/icons/options/index.json
          echo "Favicon index generated: $(cat assets/icons/options/index.json | jq length) icons"

      - name: Show generated files
        run: |
          echo "=== Generated transliteration files ==="
          find data -name "*_sa.txt" -o -name "*_iast.txt" | sort
          echo "=== Generated images ==="
          find assets/images -name "*.svg" | sort

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github,node_modules,scripts,package.json,package-lock.json'
